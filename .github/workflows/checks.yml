name: Site checks

# Runs on every push and pull request: types, unit tests and a production build.
# The browser checks (npm run check, npm run check:palette) run locally, not here.
# Vercel deploys on its own; a red run here means "look before you share", not "the site is down".
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types and unit tests
        run: |
          npx next typegen
          npx tsc --noEmit
          npm test

      - run: npx next build
